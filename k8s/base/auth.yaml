# auth: accounts, bcrypt password hashing (CPU heavy!), JWT issuing. Python/FastAPI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: shopfleet
automountServiceAccountToken: false   # app never talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: shopfleet
  labels: { app: auth }
spec:
  replicas: 2
  revisionHistoryLimit: 5             # how many old ReplicaSets to keep for `kubectl rollout undo`
  selector:
    matchLabels: { app: auth }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # never drop below desired capacity during a rollout
  template:
    metadata:
      labels:
        app: auth
        tier: app
        shopfleet.io/metrics-port: http
        shopfleet.io/db-client: "true"
        shopfleet.io/chaos: "allowed"
    spec:
      serviceAccountName: auth
      priorityClassName: shopfleet-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas across nodes (and zones, on regional clusters) so one node failure isn't an outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: auth } }
      initContainers:
        # Init container: runs to completion BEFORE the app starts. Here: block until Postgres accepts TCP.
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 $(DB_HOST) $(DB_PORT); do echo waiting for $(DB_HOST):$(DB_PORT); sleep 2; done"]
          envFrom:
            - configMapRef: { name: shopfleet-config }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: auth
          image: shopfleet/auth:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: shopfleet-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DB_PASSWORD } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: admin-credentials, key: email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: admin-credentials, key: password } }
            - name: JWT_SECRET_FILE
              value: /etc/shopfleet/jwt/jwt-secret
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }     # no CPU limit on purpose: avoids throttling, see docs/02-day2-operations.md
          # startupProbe: give slow starts time before liveness kicks in.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # readinessProbe: failing => removed from Service endpoints (no traffic), NOT restarted.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # livenessProbe: failing => container is restarted. Keep it dependency-free.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }     # let endpoint removal propagate before the app gets SIGTERM
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: jwt, mountPath: /etc/shopfleet/jwt, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: jwt
          secret: { secretName: jwt-signing-key, defaultMode: 0440 }   # Secret as a FILE (re-read on rotation)
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: shopfleet
  labels: { app: auth }
spec:
  type: ClusterIP
  selector: { app: auth }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# PodDisruptionBudget: voluntary disruptions (node drains, upgrades, autoscaler
# scale-down) may not take this service below 1 ready pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
  namespace: shopfleet
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: auth }
---
# HorizontalPodAutoscaler: adds/removes replicas to keep average CPU near 60% of *requests*.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
  namespace: shopfleet
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # wait before scaling in, to avoid flapping
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
