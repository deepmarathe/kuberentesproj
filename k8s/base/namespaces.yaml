# Namespaces isolate names, RBAC, quotas and network policies.
# Pod Security Admission "restricted" = pods must run as non-root, drop all Linux
# capabilities, use the RuntimeDefault seccomp profile, etc. Every pod in this app complies.
apiVersion: v1
kind: Namespace
metadata:
  name: shopfleet
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
  labels:
    pod-security.kubernetes.io/enforce: restricted
