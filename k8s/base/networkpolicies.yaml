# ---------------------------------------------------------------------------
# NetworkPolicies (enforced by GKE Dataplane V2). Model: deny all ingress by
# default, then allow only the paths the architecture needs.
#
#   internet -> LB -> frontend, catalog, cart, orders, auth, notifications, ops-api (public HTTP)
#   ops-api -> node-agent (DaemonSet) on 9100
#   orders  -> payment                                   (payment is NOT reachable by anyone else)
#   db-client pods    -> postgres
#   redis-client pods -> redis
#   Managed Prometheus collectors (gmp-system) -> all pods (metrics scraping)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: shopfleet
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-http
  namespace: shopfleet
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [frontend, catalog, cart, orders, auth, notifications, ops-api] }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]    # from anywhere: LB, health checks, load generator, peers
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-from-orders-only
  namespace: shopfleet
spec:
  podSelector:
    matchLabels: { app: payment }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: orders } }
      ports: [{ port: 8080, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-db-clients
  namespace: shopfleet
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { shopfleet.io/db-client: "true" } }
      ports: [{ port: 5432, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-redis-clients
  namespace: shopfleet
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { shopfleet.io/redis-client: "true" } }
      ports: [{ port: 6379, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scraping
  namespace: shopfleet
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gmp-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 9100, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-agent-from-ops-api
  namespace: shopfleet
spec:
  podSelector:
    matchLabels: { app: node-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ops-api } }
      ports: [{ port: 9100, protocol: TCP }]
