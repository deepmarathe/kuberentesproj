# ResourceQuota caps the TOTAL resources a namespace may request -- protects the
# cluster from one team (or one runaway HPA) eating everything. See labs/08.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shopfleet-quota
  namespace: shopfleet
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 16Gi
    pods: "80"
    persistentvolumeclaims: "6"
    services.loadbalancers: "0"   # force traffic through the Ingress
---
# LimitRange gives defaults to containers that forget to set requests/limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: shopfleet-defaults
  namespace: shopfleet
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 2Gi }
---
# PriorityClasses decide who gets evicted/preempted first when the cluster is full.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: shopfleet-critical
value: 100000
description: Stateful backbone (Postgres, Redis). Preempts everything else in the app.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: shopfleet-standard
value: 10000
globalDefault: false
description: Customer-facing services.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: shopfleet-low
value: 100
preemptionPolicy: Never
description: Load generator and batch work. First to be preempted, never preempts others.
