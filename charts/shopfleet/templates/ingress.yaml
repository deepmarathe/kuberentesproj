{{- /* Path-based routing straight to each Service (no rewrite needed: services serve their full /api/<name> paths). */ -}}
{{- $routes := list (list "/api/catalog" "catalog") (list "/api/cart" "cart") (list "/api/orders" "orders") (list "/api/auth" "auth") (list "/api/notify" "notifications") (list "/api/ops" "ops-api") (list "/" "frontend") }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopfleet
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          {{- range $routes }}
          - path: {{ index . 0 }}
            pathType: Prefix
            backend: { service: { name: {{ index . 1 }}, port: { number: 8080 } } }
          {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- if and .Values.gateway.createGateway (not .Values.gateway.parentGateway) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopfleet
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes: { namespaces: { from: Same } }
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopfleet
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentGateway | default "shopfleet" }}
  rules:
    {{- range $routes }}
    - matches: [{ path: { type: PathPrefix, value: {{ index . 0 }} } }]
      backendRefs: [{ name: {{ index . 1 }}, port: 8080 }]
    {{- end }}
{{- end }}
