{{- /*
One loop renders every stateless service from .Values.apps.
Each app gets: ServiceAccount, Deployment, Service (unless noService), PDB (unless noPdb), HPA (if hpa.enabled).
Try:  helm template sf ./charts/shopfleet --show-only templates/apps.yaml | less
*/ -}}
{{- range $name, $a := .Values.apps }}
{{- $port := $a.port | default 8080 }}
{{- $uid := $a.uid | default 10001 }}
{{- $portName := ternary "metrics" "http" (default false $a.worker) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "shopfleet.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "shopfleet.labels" $ | nindent 4 }}
spec:
  {{- if not (and $a.hpa $a.hpa.enabled) }}
  replicas: {{ $a.replicas }}
  {{- end }}
  {{- /* With an HPA we omit replicas so `helm upgrade` doesn't fight the autoscaler. */}}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: {{ $name }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: {{ $name }}
        tier: app
        shopfleet.io/metrics-port: {{ ternary "none" $portName (default false $a.noMetrics) }}
        {{- if $a.db }}
        shopfleet.io/db-client: "true"
        {{- end }}
        {{- if $a.redis }}
        shopfleet.io/redis-client: "true"
        {{- end }}
        {{- if $a.chaos }}
        shopfleet.io/chaos: "allowed"
        {{- end }}
      annotations:
        # Changing the ConfigMap changes this checksum -> pods roll automatically (classic Helm pattern).
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      priorityClassName: shopfleet-standard
      terminationGracePeriodSeconds: {{ $a.terminationGracePeriodSeconds | default 30 }}
      {{- include "shopfleet.imagePullSecrets" $ | nindent 6 }}
      {{- include "shopfleet.podSecurity" $uid | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: {{ $name }} } }
      {{- if or $a.waitForDb $a.logSidecar }}
      initContainers:
        {{- if $a.waitForDb }}
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 $(DB_HOST) $(DB_PORT); do echo waiting for $(DB_HOST):$(DB_PORT); sleep 2; done"]
          envFrom: [{ configMapRef: { name: shopfleet-config } }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
          {{- include "shopfleet.containerSecurity" $ | nindent 10 }}
        {{- end }}
        {{- if $a.logSidecar }}
        - name: access-log           # native sidecar
          image: busybox:1.36
          restartPolicy: Always
          command: ["sh", "-c", "touch /var/log/shopfleet/access.log; while true; do sleep 600; : > /var/log/shopfleet/access.log; done & tail -n0 -F /var/log/shopfleet/access.log"]
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 32Mi } }
          {{- include "shopfleet.containerSecurity" $ | nindent 10 }}
          volumeMounts: [{ name: logs, mountPath: /var/log/shopfleet }]
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "shopfleet.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: {{ $portName }}, containerPort: {{ $port }} }
          envFrom:
            - configMapRef: { name: shopfleet-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            {{- if $a.db }}
            {{- include "shopfleet.dbEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $a.jwt }}
            - { name: JWT_SECRET_FILE, value: /etc/shopfleet/jwt/jwt-secret }
            {{- end }}
            {{- if $a.admin }}
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: admin-credentials, key: email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: admin-credentials, key: password } }
            {{- end }}
            {{- if $a.paymentChaos }}
            - { name: CHAOS_CONFIG_FILE, value: /etc/payment/chaos.json }
            {{- end }}
          resources: {{- toYaml $a.resources | nindent 12 }}
          {{- if $a.worker }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$(find /tmp/heartbeat -mmin -1)\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- else }}
          startupProbe:
            httpGet: { path: {{ $a.healthPath | default "/healthz" }}, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: {{ $a.healthPath | default "/readyz" }}, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: {{ $a.healthPath | default "/healthz" }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          {{- include "shopfleet.containerSecurity" $ | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $a.jwt }}
            - { name: jwt, mountPath: /etc/shopfleet/jwt, readOnly: true }
            {{- end }}
            {{- if $a.paymentChaos }}
            - { name: chaos, mountPath: /etc/payment, readOnly: true }
            {{- end }}
            {{- if $a.logSidecar }}
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: logs, mountPath: /var/log/shopfleet }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if $a.jwt }}
        - name: jwt
          secret: { secretName: jwt-signing-key, defaultMode: 0440 }
        {{- end }}
        {{- if $a.paymentChaos }}
        - name: chaos
          configMap: { name: payment-chaos }
        {{- end }}
        {{- if $a.logSidecar }}
        - { name: cache, emptyDir: {} }
        - name: logs
          emptyDir: { sizeLimit: 64Mi }
        {{- end }}
{{- if not $a.noService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "shopfleet.labels" $ | nindent 4 }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - { name: http, port: 8080, targetPort: {{ $port }} }
{{- end }}
{{- if not $a.noPdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "shopfleet.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: {{ $name }} }
{{- end }}
{{- if and $a.hpa $a.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "shopfleet.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $a.hpa.min }}
  maxReplicas: {{ $a.hpa.max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $a.hpa.cpu }} } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
{{- end }}
{{- end }}
