apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # `helm uninstall` leaves it, so the PVC's data stays usable
type: Opaque
data:
  DB_USER: {{ .Values.secrets.dbUser | b64enc }}
  DB_PASSWORD: {{ include "shopfleet.secretValue" (dict "root" $ "secret" "postgres-credentials" "key" "DB_PASSWORD" "value" .Values.secrets.dbPassword) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-key
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ include "shopfleet.secretValue" (dict "root" $ "secret" "jwt-signing-key" "key" "jwt-secret" "value" .Values.secrets.jwtKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-credentials
  labels: {{- include "shopfleet.labels" . | nindent 4 }}
type: Opaque
data:
  email: {{ .Values.secrets.adminEmail | b64enc }}
  password: {{ include "shopfleet.secretValue" (dict "root" $ "secret" "admin-credentials" "key" "password" "value" .Values.secrets.adminPassword) }}
