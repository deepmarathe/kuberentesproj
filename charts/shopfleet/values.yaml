# Default values for shopfleet. Override with -f my-values.yaml or --set key=value.
#   helm show values ./charts/shopfleet           # see all of these
#   helm get values shopfleet -n shopfleet --all   # what a release is actually using

image:
  registry: shopfleet            # e.g. us-central1-docker.pkg.dev/PROJECT/shopfleet
  tag: ""                        # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []             # e.g. [{ name: ar-cred }]  -- CKAD: private registries

# Cluster-scoped objects. Disable if another release already created them.
priorityClasses:
  create: true

governance:
  quota: { enabled: true, cpu: "8", memory: 8Gi, limitsMemory: 16Gi, pods: "80" }
  limitRange: { enabled: true }

networkPolicies:
  enabled: true                  # needs a CNI that enforces them (Calico, Cilium, GKE Dataplane V2)

storage:
  storageClassName: ""           # "" = cluster default StorageClass
  postgres: 2Gi
  redis: 1Gi

config:
  logLevel: INFO
  cacheTtlSeconds: 30
  chaosEnabled: true
  paymentTimeoutSeconds: 3
  fulfillSeconds: 2

paymentChaos:                    # hot-reloaded by payment from a mounted ConfigMap
  failure_rate: 0.0
  decline_rate: 0.03
  latency_ms: 80
  jitter_ms: 120
  hang_rate: 0.0

secrets:
  dbUser: shop
  dbPassword: ""                 # empty = generate once, keep on upgrades (lookup)
  jwtKey: ""                     # empty = generate once
  adminEmail: admin@shopfleet.local
  adminPassword: ""              # empty = generate once -> see `helm status` NOTES for how to read it

# Stateless services. Each entry becomes ServiceAccount + Deployment + Service (+ HPA, PDB).
apps:
  catalog:
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
    hpa: { enabled: true, min: 2, max: 8, cpu: 60 }
    db: true
    redis: true
    jwt: true
    waitForDb: true
    chaos: true
  cart:
    replicas: 2
    uid: 1000
    resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
    hpa: { enabled: true, min: 2, max: 6, cpu: 70 }
    redis: true
    chaos: true
  orders:
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
    hpa: { enabled: true, min: 2, max: 6, cpu: 60 }
    db: true
    redis: true
    jwt: true
    waitForDb: true
    chaos: true
  auth:
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
    hpa: { enabled: true, min: 2, max: 6, cpu: 60 }
    db: true
    jwt: true
    waitForDb: true
    admin: true
  notifications:
    replicas: 2
    uid: 1000
    resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 128Mi } }
    redis: true
    jwt: true
  payment:
    replicas: 2
    uid: 65532
    resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 64Mi } }
    paymentChaos: true
    chaos: true
  frontend:
    replicas: 2
    uid: 101
    resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }
    hpa: { enabled: true, min: 2, max: 4, cpu: 70 }
    healthPath: /healthz
    noMetrics: true
    logSidecar: true
  worker:
    replicas: 1
    port: 9100
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
    hpa: { enabled: true, min: 1, max: 5, cpu: 70 }
    db: true
    redis: true
    waitForDb: true
    worker: true
    noService: true
    noPdb: true
    terminationGracePeriodSeconds: 60

opsApi:
  enabled: true
  resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { memory: 192Mi } }

operator:
  enabled: true
  replicas: 2
  resyncSeconds: 20
  resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 128Mi } }

nodeAgent:
  enabled: true
  resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }

cronJobs:
  restock: { schedule: "*/15 * * * *", suspend: false }
  orderReaper: { schedule: "*/5 * * * *", suspend: false }
  recommender: { schedule: "*/30 * * * *", suspend: false }
  dailyReport: { schedule: "0 6 * * *", suspend: false, bucket: "" }
  chaosMonkey: { schedule: "*/10 * * * *", suspend: true }

loadgen:
  enabled: true
  minUsers: 3
  maxUsers: 15
  periodMinutes: 60
  spikeEveryMinutes: 0
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }

# External access. Pick ONE (or none and use `kubectl port-forward`).
ingress:
  enabled: false
  className: ""                  # e.g. traefik, nginx, gce
  host: ""                       # "" = any host
  annotations: {}
gateway:
  enabled: false                 # Gateway API HTTPRoute (CKA topic)
  createGateway: true
  gatewayClassName: traefik
  listenerPort: 8000             # traefik's default "web" entrypoint port inside the cluster
  parentGateway: ""              # use an existing Gateway instead (name)
