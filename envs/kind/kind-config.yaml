# kind cluster shaped like the exam: 1 control plane + 2 workers, our own CNI (Calico).
#   kind create cluster --config envs/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
networking:
  disableDefaultCNI: true          # we install Calico ourselves (CKA: "install a CNI")
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 }   # Traefik NodePort -> http://localhost:8080
  - role: worker
  - role: worker
