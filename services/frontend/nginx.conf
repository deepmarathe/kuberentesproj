# Frontend: serves the static SPA and reverse-proxies /api/* to backend Services.
# On GKE the Ingress routes /api/* directly to each Service; this proxy makes the
# same URLs work locally (docker compose) and for in-cluster traffic (load generator).
log_format json escape=json '{"severity":"INFO","message":"$request_method $uri $status",'
  '"service":"frontend","httpRequest":{"requestMethod":"$request_method","requestUrl":"$request_uri",'
  '"status":$status,"responseSize":"$body_bytes_sent","userAgent":"$http_user_agent",'
  '"remoteIp":"$remote_addr","latency":"${request_time}s"},"upstream":"$upstream_addr"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout json;
    access_log /var/log/shopfleet/access.log json;   # also read by the access-log sidecar

    # Kubernetes probes hit this; keep it cheap and out of the logs.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /api/frontend/info {
        default_type application/json;
        add_header X-Served-By $hostname always;
        return 200 '{"service":"frontend","pod":"$hostname"}';
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    location /api/catalog/ { proxy_pass http://catalog:8080; }
    location /api/cart     { proxy_pass http://cart:8080; }
    location /api/orders   { proxy_pass http://orders:8080; }
    location /api/auth     { proxy_pass http://auth:8080; }
    location /api/ops      { proxy_pass http://ops-api:8080; }

    # Server-Sent Events: no buffering, long read timeout (the stream stays open for minutes).
    location /api/notify {
        proxy_pass http://notifications:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
